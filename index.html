<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stellar Bounty Hunter - Space Shooter</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #03050b, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', 'Fira Code', monospace;
            overflow: hidden;
            touch-action: manipulation;
        }





        .game-container {
            position: relative;
            box-shadow: 0 0 32px rgba(0, 255, 255, 0.2);
            border-radius: 16px;
            background: #000;
        }

        canvas {
            display: block;
            margin: 0 auto;
            cursor: none;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        /* Overlay panels (glassmorphic style) */
        .overlay-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 12, 24, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            z-index: 20;
            border-radius: 16px;
        }

        .panel-card {
            background: rgba(8, 20, 36, 0.85);
            border: 1px solid cyan;
            border-radius: 32px;
            padding: 28px 32px;
            width: 320px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            color: white;
        }

        .panel-card h2 {
            margin-top: 0;
            color: #0ff;
            letter-spacing: 2px;
        }

        input, button, select {
            background: rgba(10, 20, 40, 0.9);
            border: 1px solid rgba(42, 170, 255, 0.85);
            color: white;
            padding: 10px 16px;
            margin: 8px 0;
            border-radius: 48px;
            font-family: inherit;
            font-size: 1rem;
            width: calc(100% - 20px);
            outline: none;
            transition: 0.2s;
        }


        button {
            background: #1f3a5f;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: #2b5a8c;
            box-shadow: 0 0 12px cyan;
            border-color: cyan;
        }

        .stats-line {
            font-size: 14px;
            margin: 6px 0;
            color: #ccf;
        }

        .menu-option {
            margin: 12px 0;
            font-size: 18px;
            background: #0f1b2f;
            padding: 6px;
            border-radius: 48px;
            transition: 0.1s;
            cursor: pointer;
        }

        .menu-option.selected {
            background: #2c6e9e;
            color: #0ff;
            box-shadow: 0 0 8px cyan;
        }

        .hidden {
            display: none;
        }

        .pause-icon {
            position: absolute;
            bottom: 12px;
            right: 18px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 15;
        }

        /* Mobile touch controls */
        .touch-buttons {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 12px;
            display: flex;
            justify-content: space-between;
            z-index: 16;
            pointer-events: none; /* enable only buttons */
        }

        .touch-btn {
            width: 90px;
            height: 70px;
            border-radius: 18px;
            background: rgba(10, 20, 40, 0.45);
            border: 1px solid rgba(42, 170, 255, 0.8);
            box-shadow: 0 0 18px rgba(0,255,255,0.12);
            color: #dff;
            font-weight: 900;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            pointer-events: auto;
            touch-action: none;
        }

        @media (max-width: 520px) {
            .touch-btn { width: 80px; height: 64px; border-radius: 16px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="900" height="700"></canvas>
    <div id="pauseHint" class="pause-icon">⏸️ P / ESC</div>

    <!-- Mobile pause button (top-right) -->
    <div id="pauseButtonUI" class="pause-icon" style="top:14px; bottom:auto; right:14px; cursor:pointer; pointer-events:auto; z-index:25;" title="Pause">⏸️</div>


    <!-- Bottom touch buttons -->
    <div id="touchButtons" class="touch-buttons">
        <div class="touch-btn touch-left" id="touchLeft">◀</div>
        <div class="touch-btn touch-right" id="touchRight">▶</div>
    </div>

    





    

    

    
    <!-- LOGIN PANEL -->
    <div id="loginPanel" class="overlay-panel">
        <div class="panel-card">
            <h2>✧ STAR COMMAND ✧</h2>

            <input type="text" id="loginUsername" placeholder="Pilot callsign" maxlength="20" autocomplete="off">
            <input type="text" id="loginPassword" placeholder="Password (any, 4+ chars)" autocomplete="off">

            <div class="stats-line" style="margin-top:10px;">Existing pilots</div>
            <select id="existingUserSelect" aria-label="Existing pilot">
                <option value="">(none yet)</option>
            </select>


            <button id="loginExistingBtn" style="margin-top:10px;">▶ LOGIN EXISTING</button>
            <button id="registerNewBtn">✦ REGISTER NEW</button>

            <div id="loginMsg" style="color:#f88; font-size:13px; margin-top:8px;"></div>
            <div class="stats-line" style="margin-top:12px;">⚡ offline highscore per pilot</div>
        </div>
    </div>


    <!-- MAIN MENU PANEL -->
    <div id="menuPanel" class="overlay-panel hidden">
        <div class="panel-card">
            <h2>⚡ SPECTRAL SHOOTER ⚡</h2>
            <button id="startGameBtn">🪐 START MISSION</button>
            <div id="menuStats" class="stats-line"></div>
            <div class="stats-line" style="font-size:12px;">←→ ↑↓  |  [Z / SPACE] auto-fire</div>
            <div class="stats-line" style="font-size:12px;">V : vertical lock  |  P : pause</div>
        </div>
    </div>

    <!-- PAUSE MENU -->
    <div id="pausePanel" class="overlay-panel hidden">
        <div class="panel-card">
            <h2>⏸ INTERRUPTION</h2>
            <div class="stats-line" style="margin-top:6px;">Choose an option</div>
            <div style="margin-top:10px;">
                <button id="pauseMenuBtn0" style="margin-top:0;">🏠 Game Menu</button>
                <button id="pauseMenuBtn1">🔄 Restart Stage</button>
                <button id="pauseMenuBtn2">↩ Back to Game</button>
            </div>
            <div class="stats-line" style="font-size:12px; margin-top:12px;">(Keyboard: ▲/▼ then Enter also works)</div>
        </div>
    </div>


    <!-- GAME OVER PANEL -->
    <div id="gameoverPanel" class="overlay-panel hidden">
        <div class="panel-card">
            <h2 style="color:#f66;">💀 MISSION FAILED 💀</h2>
            <div id="gameoverStats"></div>
            <button id="restartGameBtn">🔄 RESTART</button>
            <button id="menuQuitBtn">🏠 MAIN MENU</button>
        </div>
    </div>

    <!-- VICTORY PANEL -->
    <div id="victoryPanel" class="overlay-panel hidden">
        <div class="panel-card">
            <h2 style="color:#6f6;">✨ VICTORY! ✨</h2>
            <div id="victoryStats"></div>
            <button id="victoryRestartBtn">🌟 PLAY AGAIN</button>
            <button id="victoryMenuBtn">🏆 MAIN MENU</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CONFIGURATION ----------
        const W = 900, H = 700;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = W; canvas.height = H;

        // GLOBALS
        let gameState = "login";     // login, menu, playing, paused, gameover, victory
        let currentUser = null;
        let userHighScore = 0;
        let userLastScore = null;
        let userGamesPlayed = 0;
        
        // Game data
        let score = 0, wave = 1, enemiesKilled = 0;
        let highScoreDisplay = 0;
        let newHighScoreFlag = false;
        let gameSessionSaved = false;

        // Player
        let player = {
            x: W/2, y: H-100, width: 32, height: 32, lives: 3, maxLives: 5,
            invincible: false, invincibleTimer: 0, speed: 320, weaponLevel: 1,
            verticalEnabled: true
        };
        
        // Dynamic entities
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let powerups = [];
        let particles = [];
        
        // powerup timers
        let shieldActive = false, shieldTimer = 0;
        let rapidFire = false, rapidTimer = 0;
        let doubleScore = false, doubleScoreTimer = 0;
        let shotCooldown = 0;
        let shootDelay = 0.12; // seconds
        
        // Stage system
        let stagePhase = "enemies"; // enemies, boss_warning, boss, clear_anim, arrival, boss_defeat_suspend, boss_defeat_takeoff
        let stageEnemyTarget = 12;
        let stageEnemyKills = 0;
        let spawnTimer = 0;
        // Boss gating per-stage: when player kills reach threshold, spawn boss.
        // Base thresholds:
        // - Stage 1: boss at 13 or 15 kills
        // - Each new stage increases required kills by +1 multiplier.
        //   i.e., Stage 2 requires double, Stage 3 triple, etc.
        let startBossTimer = 999999;
        let startBossTriggered = false;

        let bossBaseThresholdA = 13;
        let bossBaseThresholdB = 15;



        // Boss defeat animation sequencing
        let bossDefeatTimer = 0;
        let bossDefeatStep = 0; // 0 suspend, 1 takeoff

        let clearBannerTimer = 0;
        let arrivalTimer = 0;
        let arrivalText = "";
        let clearMessage = "";
        let bossWarningTimer = 0, bossWarningText = "";
        let currentProfile = { theme: 'space', difficulty: 1, bossKind: 'octopus' };
        let ultraBossActive = false;
        let pendingUltra = false;
        let playerDeparting = false;
        
        // stars and visual
        let stars = [];
        let screenShake = 0;
        let shakeOffset = {x:0,y:0};
        
        // keyboard handling
        const keysPressed = new Set();
        let pauseMenuIndex = 0;
        const pauseItems = ["Game Menu", "Restart Stage", "Back to Game"];
        
        // Background animations
        let bgClouds = [], bgMeteors = [];
        
        // --- helper functions
        function random(min,max) { return min + Math.random() * (max-min); }
        function randInt(min,max) { return Math.floor(random(min,max+1)); }

        // --- sprite loading (graceful fallback to primitives)
        const imageCache = new Map();
        function loadSprite(src){
            if(imageCache.has(src)) return imageCache.get(src);
            const img = new Image();
            // assume relative paths to HTML root
            img.src = src;

            // store a placeholder in cache so draw() can check later
            imageCache.set(src, { img: null });

            img.onload = ()=>{
                imageCache.set(src, { img });
            };
            img.onerror = ()=>{
                imageCache.set(src, { img: null });
            };
            return img;
        }


        function primeSprites(){
            const required = [
                'pics/Spaceship.png',
                'powerups/Health.png',
                'powerups/Weapon_Upgrade.png',
                'powerups/Shield.png',
                'powerups/Rapid_Fire.png',
                'powerups/Double_Score.png',
                'powerups/Invulnerability.png',
                'powerups/LVL2_Weapon.png',
                'powerups/LVL3_Weapon.png',
            ];

            // load all mobs + bosses from pics/
            for(let i=1;i<=6;i++) required.push(`pics/MOB${i}.png`);
            for(let i=1;i<=10;i++) required.push(`pics/BOSS${i}.png`);

            for(const src of required) loadSprite(src);
        }



        function getLoadedImg(src){
            const entry = imageCache.get(src);
            if(entry && entry.img) return entry.img;
            return null;
        }



        function hashString(s){
            let h = 0;
            for(let i=0;i<s.length;i++) h = ((h<<5) - h) + s.charCodeAt(i);
            return h | 0;
        }



        // --- audio assets (safe: failures won't crash the game)
        const audio = {
            bg: new Audio('sounds/background.wav'),
            shoot: new Audio('sounds/laser.wav'),
            shoot2: new Audio('sounds/shooting.wav.wav'),
            explosion: new Audio('sounds/explosion.wav'),
            boss: new Audio('sounds/boss_battle.wav'),
            death: new Audio('sounds/deathsound.wav'),
            gameover: new Audio('sounds/gameover.wav'),
        };
        audio.bg.loop = true;
        audio.bg.volume = 0.35;

        function playSfx(a, vol=0.6) {
            try {
                if(!a) return;
                a.volume = vol;
                a.currentTime = 0;
                const p = a.play();
                if(p && typeof p.catch === 'function') p.catch(()=>{});
            } catch(_e) {}
        }
        function playBg() {
            try {
                const p = audio.bg.play();
                if(p && typeof p.catch === 'function') p.catch(()=>{});
            } catch(_e) {}
        }
        function playShoot() {
            // prefer laser.wav fallback to shooting.wav.wav
            if(audio.shoot && audio.shoot.src) playSfx(audio.shoot, 0.45);
            else playSfx(audio.shoot2, 0.45);
        }
        function playExplosion() { playSfx(audio.explosion, 0.65); }
        function playBossBattle() { playSfx(audio.boss, 0.55); }
        function playDeath() { playSfx(audio.death, 0.6); }
        function playGameOver() { playSfx(audio.gameover, 0.65); }

        
        // SQLite-backed user manager via local Flask server (server.py)
        async function loadUserStats(username) {
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // password is ignored by server (to match original behavior)
                    body: JSON.stringify({ username: username, password: 'x' })
                });
                if(!resp.ok) return;
                const data = await resp.json();
                userHighScore = data.highScore || 0;
                userGamesPlayed = data.gamesPlayed || 0;
                userLastScore = data.lastScore;
                highScoreDisplay = userHighScore;
                return true;
            } catch(_e) {}
            return false;
        }


        async function saveGameRecord() {
            if(!currentUser) return;
            try {
                const resp = await fetch('/api/save_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, score: score, wave: wave })
                });
                if(!resp.ok) return;
                const data = await resp.json();
                if((data.highScore || 0) > userHighScore) newHighScoreFlag = true;
                userHighScore = data.highScore || userHighScore;
                userGamesPlayed = data.gamesPlayed || userGamesPlayed;
                highScoreDisplay = userHighScore;
                gameSessionSaved = true;
            } catch(_e) {}
        }
        
        // initialize fresh game session
        function resetGameSession() {
            score = 0; wave = 1; enemiesKilled = 0; newHighScoreFlag = false;
            gameSessionSaved = false;
            // reset boss-at-start behavior
            startBossTimer = 10;
            startBossTriggered = false;
            player = {
                x: W/2, y: H-100, width: 32, height: 32, lives: 3, maxLives: 5,
                invincible: false, invincibleTimer: 0, speed: 320, weaponLevel: 1,
                verticalEnabled: true
            };
            shieldActive = false; rapidFire = false; doubleScore = false;
            enemies = []; bullets = []; enemyBullets = []; powerups = []; particles = [];
            stageEnemyKills = 0; stagePhase = "arrival";
            arrivalTimer = 1.2; arrivalText = "🚀 ENTERING DEEP SPACE";
            clearBannerTimer = 0; playerDeparting = false; ultraBossActive = false; pendingUltra = false;
            bossWarningTimer = 0;
            setupStage(1);
        }
        
        function setupStage(stageNum) {
            wave = stageNum;
            // allow boss logic to trigger again for this stage
            startBossTriggered = false;
            stagePhase = "arrival";
            let difficulty = 1 + (wave-1)*0.15;
            let bossPool = ['octopus','grozilla','growly','manta','scorpion','wyvern','serpent','warden','behemoth','overseer'];
            currentProfile = {
                theme: 'space',
                difficulty: Math.min(2.8, difficulty),
                bossKind: bossPool[(wave-1)%bossPool.length],
                enemyTarget: Math.min(40, 12 + Math.floor(wave * 2.2))
            };
            stageEnemyTarget = currentProfile.enemyTarget;
            stageEnemyKills = 0;
            stagePhase = "arrival";
            arrivalTimer = 1.8;
            arrivalText = `⚡ STAGE ${wave} : ${currentProfile.bossKind.toUpperCase()} SECTOR ⚡`;
            player.invincible = true;
            player.invincibleTimer = 1.2;
            player.x = W/2;
            player.y = H-80;
            enemies = [];
            enemyBullets = [];
            powerups = [];
            if(wave === 1) stagePhase = "enemies";
        }
        
        function spawnStageEnemy(deltaTime) {
            if(stagePhase !== "enemies") return;

            let difficulty = currentProfile.difficulty;
            let variant = randInt(0,3);
            let typeVariant = ['basic','fast','tank','swoop'][variant];
            let health = 1;
            let speed = 100 + difficulty*25;
            let points = 10 + Math.floor(wave*3);
            let width = 28, height=28;
            let color = "#ff5e5e";
            if(typeVariant === 'fast') { speed += 70; width=22; height=22; points+=8; color="#ffb347";}
            if(typeVariant === 'tank') { health = 2+Math.floor(wave/4); speed*=0.7; width=36; height=36; points+=18; color="#b873ff";}
            if(typeVariant === 'swoop') { health=2; speed=120; points+=12; color="#6dc9ff";}
            // enemies spawn from above and move downward toward the player
            enemies.push({
                x: randInt(40, W-40), y: -randInt(10,50) - height, width, height, health, maxHealth:health,

                type:'enemy', variant:typeVariant, speed, points, color,
                drift: (Math.random()-0.5)*80, shootCooldown:0, shootDelay: 0.8 / difficulty,
                swoopAngle:0, amplitude: randInt(30,70)
            });
        }
        
        function spawnBoss() {
            stagePhase = "boss";
            let bossKind = currentProfile.bossKind;
            let health = 70 + Math.floor(wave * 12 * currentProfile.difficulty);
            let bossWidth = 70, bossHeight=70;
            let color = "#ff3366";
            if(bossKind === 'grozilla') color = "#ff884d";
            if(bossKind === 'overseer') color = "#b266ff";
            enemies.push({
                x: W/2, y: H-460, width:bossWidth, height:bossHeight, health, maxHealth:health,

                type:'boss', bossKind, phase:1, attackTimer:0, speed: 90, direction:1,
                color, points: 600 + wave*40, attackPattern:0,
                spawnImmunity:0.8
            });
        }
        
        function triggerStageClear(message = "STAGE CLEARED!") {
            for(let i=0;i<30;i++) createExplosion(W/2, H/2, "#ffff88");
            screenShake = 12;
            stagePhase = "clear_anim";
            clearBannerTimer = 2.0;
            clearMessage = message;
            playerDeparting = true;
            player.invincible = true;
            if(player.weaponLevel < 4) player.weaponLevel++;
            enemies = enemies.filter(e=> e.type !== 'minion');
            enemyBullets = [];
        }
        
        function createExplosion(x,y,color="#ffaa44") {
            playExplosion();
            for(let i=0;i<12;i++) particles.push({
                x:x+randInt(-8,8), y:y+randInt(-8,8), vx:randInt(-90,90), vy:randInt(-120,20),
                life:0.7, maxLife:0.7, size:randInt(3,6), color:color, gravity:-100
            });
        }
        
        function shootBullet() {
            playShoot();
            let dmg = 1;
            let lvl = player.weaponLevel;

            if(lvl===1) bullets.push({x:player.x, y:player.y-12, w:5, h:12, vx:0, vy:-580, dmg, color:"#ffff66"});
            else if(lvl===2) {
                bullets.push({x:player.x-8, y:player.y-12, w:5, h:12, vx:-30, vy:-580, dmg, color:"#66ffff"});
                bullets.push({x:player.x+8, y:player.y-12, w:5, h:12, vx:30, vy:-580, dmg, color:"#66ffff"});
            } else if(lvl===3) {
                bullets.push({x:player.x, y:player.y-12, w:5, h:12, vx:0, vy:-620, dmg:2, color:"#88ff88"});
                bullets.push({x:player.x-12, y:player.y-10, w:5, h:12, vx:-80, vy:-560, dmg:1, color:"#ffaa66"});
                bullets.push({x:player.x+12, y:player.y-10, w:5, h:12, vx:80, vy:-560, dmg:1, color:"#ffaa66"});
            } else {
                for(let ang = -0.5; ang<=0.5; ang+=0.25) {
                    bullets.push({x:player.x+ang*22, y:player.y-14, w:5, h:12, vx:ang*180, vy:-560, dmg: ang===0?2:1, color:"#ffcc88"});
                }
            }
        }
        
        // update & collisions with delta time
        let lastTimestamp = 0;
        let deltaTime = 1/60;
        function gameLoop(nowMs) {
            if(!lastTimestamp) lastTimestamp = nowMs;
            let dt = Math.min(0.033, (nowMs - lastTimestamp) / 1000);
            if(dt<=0) { lastTimestamp = nowMs; requestAnimationFrame(gameLoop); return; }
            deltaTime = dt;
            lastTimestamp = nowMs;
            updateGame(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function updateGame(dt) {
            if(gameState !== "playing") return;
            
            // screen shake decay
            if(screenShake>0) { screenShake -= dt*20; shakeOffset = {x:randInt(-4,4), y:randInt(-4,4)}; }
            else shakeOffset = {x:0,y:0};
            
            // Boss gating per stage based on kills. Once reached, enter boss_warning.
            if(!startBossTriggered) {
                startBossTimer -= dt;

                const stageMult = Math.max(1, wave);
                const thresholdA = bossBaseThresholdA * stageMult;
                const thresholdB = bossBaseThresholdB * stageMult;

                const canStart = (stageEnemyKills >= thresholdA) || (stageEnemyKills >= thresholdB);

                if(canStart && stagePhase === "enemies") {
                    startBossTriggered = true;
                    stagePhase = "boss_warning";
                    bossWarningTimer = 2.2;
                    bossWarningText = `⚠️ ${currentProfile.bossKind.toUpperCase()} APPROACHES! ⚠️
MISSION LOCK: BOSS INCOMING…
UNLOAD YOUR ARMOR ⚠️`;
                    // Remove remaining normal mobs immediately, keep only boss entities (none yet)
                    enemies = enemies.filter(e=>e.type==='boss');
                    enemyBullets = [];
                    return;
                }
            }



            
            // stage arrival / clear animations
            if(stagePhase === "arrival") {
                arrivalTimer -= dt;
                if(arrivalTimer <=0) stagePhase = "enemies";
            }
            if(stagePhase === "clear_anim") {
                clearBannerTimer -= dt;
                if(playerDeparting) player.y -= 180*dt;
                if(player.y < -80 || clearBannerTimer<=0) {
                    if(ultraBossActive) { gameState="victory"; saveGameRecord(); }
                    else if(wave >= 10) { ultraBossActive=true; pendingUltra=true; setupStage(11); wave=10; stagePhase="arrival"; arrivalTimer=2; arrivalText="⚔️ TYRANT DOMINION ⚔️"; player.y=H-80; playerDeparting=false; }
                    else setupStage(wave+1);
                    return;
                }
            }
            if(stagePhase === "boss_warning") {
                bossWarningTimer -= dt;
                if(bossWarningTimer<=0) {
                    // spawn boss once, then keep normal gameplay running (don't return)
                    spawnBoss();
                    stagePhase = "boss";
                }
            }
            if(stagePhase === "boss") {
                // do not early-return; allow boss to update/move and collisions to run
            }

            if(stagePhase === "boss_warning") {
                return;
            }
            if(stagePhase === "boss_defeat_suspend") {
                bossDefeatTimer -= dt;
                // suspended: lock player controls and slow/stop
                player.verticalEnabled = false;
                player.speed = 0;
                if(bossDefeatTimer <= 0) {
                    stagePhase = "boss_defeat_takeoff";
                    bossDefeatTimer = 0.8;
                    player.speed = 320;
                }
                return;
            }
            // Ensure vertical controls are restored for all playable phases
            if(stagePhase !== "boss_defeat_suspend" && stagePhase !== "boss_defeat_takeoff") {
                player.verticalEnabled = true;
            }
            if(stagePhase === "boss_defeat_takeoff") {
                bossDefeatTimer -= dt;
                // fast takeoff upward
                player.y -= 520 * dt;
                if(player.y < -60) player.y = -60;
                if(bossDefeatTimer <= 0) {
                    // next stage loop
                    if(ultraBossActive) { gameState = "victory"; saveGameRecord(); }
                    else if(wave >= 10) { ultraBossActive=true; pendingUltra=true; setupStage(11); wave=10; stagePhase="arrival"; arrivalTimer=2; arrivalText="⚔️ TYRANT DOMINION ⚔️"; player.y=H-80; playerDeparting=false; return; }
                    else { setupStage(wave+1); return; }
                }
                return;
            }
            
            // movement
            let move = player.speed * dt;
            if(keysPressed.has('ArrowLeft')) player.x = Math.max(30, player.x - move);
            if(keysPressed.has('ArrowRight')) player.x = Math.min(W-30, player.x + move);
            if(player.verticalEnabled) {
                // ArrowUp should move the ship UP (decrease y)
                if(keysPressed.has('ArrowUp')) player.y = Math.max(60, player.y - move);
                // ArrowDown should move the ship DOWN (increase y)
                if(keysPressed.has('ArrowDown')) player.y = Math.min(H-50, player.y + move);
            }

            
            // shooting
            // Auto-fire on mobile/controls: continuously fire while playing (no need to press fire).
            // Z/Space also works; this condition keeps backwards compatibility.
            if(shotCooldown <= 0 && gameState === 'playing') {
                shootBullet();
                let cooldownBase = rapidFire ? 0.07 : Math.max(0.12, 0.28 - player.weaponLevel*0.025);
                shotCooldown = cooldownBase;
            }
            if(shotCooldown>0) shotCooldown -= dt;
            
            // powerup timers
            if(shieldActive) { shieldTimer-=dt; if(shieldTimer<=0) shieldActive=false; }
            if(rapidFire) { rapidTimer-=dt; if(rapidTimer<=0) rapidFire=false; }
            if(doubleScore) { doubleScoreTimer-=dt; if(doubleScoreTimer<=0) doubleScore=false; }
            if(player.invincible) { player.invincibleTimer-=dt; if(player.invincibleTimer<=0) player.invincible=false; }
            
            // enemy spawn logic (infinite mobs while in enemies phase)
            if(stagePhase === "enemies") {
                let activeEnemies = enemies.filter(e=>e.type==='enemy').length;
                // Keep spawning until boss gate triggers and switches stagePhase away from "enemies".
                // Boss gate will also remove remaining mobs.
                if(activeEnemies < 10) {
                    if(spawnTimer <= 0) { spawnStageEnemy(dt); spawnTimer = 0.35; }
                    else spawnTimer -= dt;
                } else {
                    spawnTimer -= dt;
                }
                // NOTE: boss start is handled by the kills-based gate above.
            }


            
            // update enemies
            for(let i=0;i<enemies.length;i++) {
                let e = enemies[i];
                if(e.type === 'enemy') {

                    e.y += e.speed * dt;

                    if(e.variant==='swoop') { e.swoopAngle+=dt*5; e.x += Math.sin(e.swoopAngle)*e.amplitude*dt; }
                    e.x += e.drift * dt;
                    if(e.y < -80 || e.x<-100 || e.x>W+100) { enemies.splice(i,1); i--; continue; }
                    if(e.shootCooldown <=0 && Math.random()<0.018) {
                        // enemy bullets travel downward toward the player
                        enemyBullets.push({x:e.x, y:e.y+10, w:5, h:10, vx:0, vy:380, color:"#ff5555", damage:1});
                        e.shootCooldown = 0.8;
                    }
                    if(e.shootCooldown>0) e.shootCooldown -= dt;
                }
                else if(e.type === 'boss') {
                    if(e.spawnImmunity>0) e.spawnImmunity -= dt;
                    e.x += e.speed * e.direction * dt;
                    if(e.x<70 || e.x>W-70) e.direction *= -1;
                    e.attackTimer -= dt;
                    if(e.attackTimer<=0) {
                        let bulletCount = 3 + Math.floor(e.health/e.maxHealth*2);
                        for(let b=0;b<bulletCount;b++) {
                            let angle = (b - bulletCount/2) * 0.9;
                            // boss bullets travel downward toward the player
                            enemyBullets.push({x:e.x, y:e.y+20, w:7, h:12, vx:angle*120, vy:480, color:"#ff3366", damage:1});
                        }
                        e.attackTimer = 0.75;
                    }
                    if(e.health/e.maxHealth < 0.33 && e.phase===1) { e.phase=2; createExplosion(e.x,e.y,"#ffaa44"); }
                    if(e.health/e.maxHealth < 0.66 && e.phase===0) { e.phase=1; }
                }
            }
            
            // bullets update
            for(let i=0;i<bullets.length;i++) {
                bullets[i].x += bullets[i].vx * dt;
                bullets[i].y += bullets[i].vy * dt;
                if(bullets[i].y > H+80 || bullets[i].y < -80 || bullets[i].x < -80 || bullets[i].x > W+80) bullets.splice(i,1), i--;
            }
            for(let i=0;i<enemyBullets.length;i++) {
                let eb = enemyBullets[i];
                eb.x += eb.vx * dt; eb.y += eb.vy * dt;
                if(eb.y<-80 || eb.y>H+100 || eb.x<-100 || eb.x>W+100) enemyBullets.splice(i,1), i--;
            }
            
            // collisions player bullets vs enemies
            for(let bi=0;bi<bullets.length;bi++) {
                let b = bullets[bi];
                for(let ei=0;ei<enemies.length;ei++) {
                    let e = enemies[ei];
                    if(Math.abs(b.x - e.x) < e.width/2+3 && Math.abs(b.y - e.y) < e.height/2+8) {
                        bullets.splice(bi,1); bi--;
                        if(e.spawnImmunity>0) break;
                        e.health -= b.dmg;
                        createExplosion(b.x,b.y,"#ffcc66",2);
                        if(e.health <=0) {
                            let pts = e.points * (doubleScore?2:1);
                            score += pts;
                            enemiesKilled++;
                            if(e.type === 'enemy') stageEnemyKills++;
                            createExplosion(e.x,e.y,e.color||"#ff6666",10);
                            if(e.type === 'boss') {
                                // trigger boss defeat animation sequence
                                stagePhase = "boss_defeat_suspend";
                                bossDefeatTimer = 1.0;
                                player.verticalEnabled = false;
                                player.speed = 0;
                                player.invincible = true;
                                player.invincibleTimer = 10;
                            }
                    if(e.type==='enemy' && Math.random()<0.65) {
                                let ptypes = ['health','weapon','shield','rapid'];
                                if(wave>=4) ptypes.push('double_score');
                                let type = ptypes[randInt(0,ptypes.length-1)];
                                // powerups fall down toward the player
                                powerups.push({x:e.x, y:e.y, type, w:18, h:18, fallSpeed:80, drift: (Math.random()-0.5)*40});
                            }
                            enemies.splice(ei,1); ei--;
                        }
                        break;
                    }
                }
            }
            
            // player damage from enemies & bullets
            if(!player.invincible && !shieldActive) {
                // enemy bullets
                for(let i=0;i<enemyBullets.length;i++) {
                    let eb = enemyBullets[i];
                    if(Math.abs(eb.x - player.x) < 20 && Math.abs(eb.y - player.y) < 22) {
                        enemyBullets.splice(i,1); i--;
                        player.lives--; 
                        if(player.lives<=0) playGameOver();
                        else playDeath();
                        player.invincible=true; player.invincibleTimer=1.2;
                        createExplosion(player.x,player.y,"#ff4444",14);
                        if(player.lives<=0) {
                            gameState="gameover";
                            saveGameRecord();
                            hidePanels();
                            showPanel("gameoverPanel");
                            try{ document.getElementById("gameoverStats").innerHTML = `🏁 SCORE: ${score}<br>🛰️ WAVE: ${wave}<br>💀 KILLS: ${enemiesKilled}`; }catch(_e){}
                            return;
                        }
                        break;
                    }
                }
                // contact with enemies
                for(let i=0;i<enemies.length;i++) {
                    let e = enemies[i];
                    if(Math.abs(e.x - player.x) < e.width/2+18 && Math.abs(e.y - player.y) < e.height/2+18) {
                        enemies.splice(i,1); i--;
                        player.lives--;
                        if(player.lives<=0) playGameOver();
                        else playDeath();
                        player.invincible=true; player.invincibleTimer=1.2;
                        createExplosion(player.x,player.y,"#ff6666",16);
                        if(player.lives<=0) {
                            gameState="gameover";
                            saveGameRecord();
                            hidePanels();
                            showPanel("gameoverPanel");
                            try{ document.getElementById("gameoverStats").innerHTML = `🏁 SCORE: ${score}<br>🛰️ WAVE: ${wave}<br>💀 KILLS: ${enemiesKilled}`; }catch(_e){}
                            return;
                        }
                        break;
                    }
                }
            }
            
            // powerups
            for(let i=0;i<powerups.length;i++) {
                let p = powerups[i];
                // fall downward toward the player
                p.y += p.fallSpeed * dt;
                p.x += p.drift * dt;
                if(p.y > H+40) { powerups.splice(i,1); i--; continue; }

                if(Math.abs(p.x-player.x)<22 && Math.abs(p.y-player.y)<22) {
                    if(p.type==='health') player.lives = Math.min(player.maxLives, player.lives+1);
                    if(p.type==='weapon') player.weaponLevel = Math.min(4, player.weaponLevel+1);
                    if(p.type==='shield') { shieldActive=true; shieldTimer=6; }
                    if(p.type==='rapid') { rapidFire=true; rapidTimer=8; }
                    if(p.type==='double_score') { doubleScore=true; doubleScoreTimer=10; }
                    powerups.splice(i,1); i--;
                }
            }
            
            // particles
            for(let i=0;i<particles.length;i++) {
                let p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.gravity * dt;
                p.life -= dt;
                if(p.life<=0) particles.splice(i,1), i--;
            }
            
            // starfield twinkle
            for(let s of stars) { s.twinkle+=dt*2; }
        }
        
        // ---- DRAWING ----
        function draw() {
            ctx.save();
            ctx.translate(shakeOffset.x, shakeOffset.y);
            // background gradient
            let grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0,"#020617"); grad.addColorStop(1,"#030014");
            ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
            // stars
            for(let s of stars) {
                let bright = 0.4+0.5*(0.5+0.5*Math.sin(s.twinkle));
                ctx.fillStyle=`rgba(255,240,200,${bright*0.7})`;
                ctx.fillRect(s.x,s.y,s.size,s.size);
            }
            // enemies
            for(let e of enemies) {

                ctx.shadowBlur=0;
                if(e.type==='boss') {
                    // Always map bossKind deterministically into available pics/BOSS1..pics/BOSS10
                    const bossIndex = 1;
                    const bossSrc = `pics/BOSS${bossIndex}.png`;
                    const img = getLoadedImg(bossSrc);



                    if(img) {
                        ctx.drawImage(img, e.x-e.width/2, e.y-e.height/2, e.width, e.height);
                    } else {

                        ctx.fillStyle = e.color || "#d43f7a";
                        ctx.shadowBlur=12; ctx.shadowColor="#ff66aa";
                        ctx.beginPath(); ctx.roundRect(e.x-e.width/2, e.y-e.height/2, e.width, e.height,12); ctx.fill();
                    }

                    ctx.fillStyle="white"; ctx.font="bold 14px monospace"; ctx.shadowBlur=0;
                    ctx.fillText(`❤️ ${e.health}`, e.x-25, e.y-30);
                    let percent = e.health/e.maxHealth;
                    ctx.fillStyle="#aa3333"; ctx.fillRect(e.x-45, e.y-44, 90, 8);
                    ctx.fillStyle="#44ff88"; ctx.fillRect(e.x-45, e.y-44, 90*percent, 8);
                } else {
                    const mobIndex = (Math.abs(hashString(e.variant||'')) % 6) + 1; // MOB1..MOB6
                    const mobSrc = `pics/MOB${mobIndex}.png`;
                    const img = getLoadedImg(mobSrc);

                    if(img) {
                        ctx.drawImage(img, e.x-e.width/2, e.y-e.height/2, e.width, e.height);
                    } else {
                        ctx.fillStyle = e.color || "#ff6b6b";
                        ctx.shadowBlur=4; ctx.shadowColor="red";
                        ctx.fillRect(e.x-e.width/2, e.y-e.height/2, e.width, e.height);
                    }

                    if(e.variant==='tank') {
                        let pct = e.health/e.maxHealth;
                        ctx.fillStyle="#aa2222"; ctx.fillRect(e.x-20, e.y-26, 40, 4);
                        ctx.fillStyle="#99ff99"; ctx.fillRect(e.x-20, e.y-26, 40*pct, 4);
                    }
                }
            }

            // bullets
            ctx.fillStyle="#ffff88"; ctx.shadowBlur=5;
            for(let b of bullets) { ctx.fillRect(b.x-2,b.y-4,5,10); }
            ctx.fillStyle="#ff5544";
            for(let eb of enemyBullets) { ctx.fillRect(eb.x-3,eb.y-5,6,10); }

            // powerups (sprites + fallback)
            for(let p of powerups) {
                const keyToSrc = {
                    health: 'powerups/Health.png',
                    weapon: 'powerups/Weapon_Upgrade.png',
                    shield: 'powerups/Shield.png',
                    rapid: 'powerups/Rapid_Fire.png',
                    double_score: 'powerups/Double_Score.png',
                    invulnerability: 'powerups/Invulnerability.png',
                    lvl2_weapon: 'powerups/LVL2_Weapon.png',
                    lvl3_weapon: 'powerups/LVL3_Weapon.png',
                };
                const src = keyToSrc[p.type] || null;
                const img = src ? getLoadedImg(src) : null;

                const w = 18, h = 18;
                if(img) {
                    ctx.drawImage(img, p.x - w/2, p.y - h/2, w, h);
                } else {
                    ctx.fillStyle = p.type==='health'?"#44ff44": p.type==='weapon'?"#44aaff": p.type==='shield'?"#88aaff":"#ffaa44";
                    ctx.fillRect(p.x-8,p.y-8,16,16);
                    ctx.fillStyle="white"; ctx.font="10px monospace";
                    ctx.fillText(p.type[0], p.x-3, p.y+3);
                }
            }

            // player ship (sprite + fallback)
            ctx.shadowBlur=8; ctx.shadowColor="#0af";
            const shipImg = getLoadedImg('pics/Spaceship.png');
            const pw = 32, ph = 32;

            if(shipImg) {
                const blink = player.invincible && (Date.now()%200<100);
                // tint-like blink by swapping alpha
                ctx.globalAlpha = blink ? 0.85 : 1.0;
                ctx.drawImage(shipImg, player.x - pw/2, player.y - ph/2, pw, ph);
                ctx.globalAlpha = 1;
            } else {
                ctx.fillStyle = player.invincible && (Date.now()%200<100) ? "#aaf" : "#6df";
                ctx.beginPath(); ctx.moveTo(player.x, player.y-18); ctx.lineTo(player.x-18, player.y+8); ctx.lineTo(player.x-6, player.y+2); ctx.lineTo(player.x-6, player.y+12); ctx.lineTo(player.x, player.y+16); ctx.lineTo(player.x+6, player.y+12); ctx.lineTo(player.x+6, player.y+2); ctx.lineTo(player.x+18, player.y+8); ctx.fill();
            }

            if(shieldActive) {
                ctx.globalAlpha=0.35;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 28,0,Math.PI*2);
                ctx.fillStyle="#3399ff";
                ctx.fill();
                ctx.globalAlpha=1;
            }
            // HUD
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillStyle="#0ff"; ctx.fillText(`❤️ ${player.lives}`, 20, 50);
            ctx.fillStyle="white"; ctx.fillText(`WAVE ${wave}`, 20, 85);
            ctx.fillStyle="#ffdd99"; ctx.fillText(`SCORE ${score}`, 20, 120);
            ctx.fillStyle="#aaffaa"; ctx.fillText(`KILLS ${enemiesKilled}`, 20, 155);
            ctx.font="14px monospace"; ctx.fillStyle="#ccc";
            ctx.fillText(`LV${player.weaponLevel} ⚡`, 20, 190);
            if(rapidFire) ctx.fillText(`RAPID ${rapidTimer.toFixed(1)}s`, 20, 215);
            if(doubleScore) ctx.fillText(`2X SCORE`, 20, 235);


            
            if(stagePhase === "boss_warning") {
                ctx.font="32px monospace"; ctx.fillStyle="#ff8844"; ctx.shadowBlur=0;
                // Center multi-line warning text
                const lines = (bossWarningText || "").split(/\n/);
                const lineH = 34;
                const startY = H/2 - (lines.length - 1) * lineH / 2;
                for(let li=0; li<lines.length; li++) {
                    const txt = lines[li];
                    const tw = ctx.measureText(txt).width;
                    ctx.fillText(txt, (W - tw) / 2, startY + li * lineH);
                }


            }

            if(stagePhase === "clear_anim" && clearBannerTimer>0) {
                ctx.font="36px monospace"; ctx.fillStyle="#bbff88";
                ctx.fillText(clearMessage, W/2-140, H/2);
            }
            if(stagePhase === "arrival" && arrivalTimer>0) {
                ctx.font="24px monospace"; ctx.fillStyle="cyan";
                ctx.fillText(arrivalText, W/2-160, H/2);
            }
            ctx.restore();
        }

        function updateExistingUserDropdown(){

                const users = raw ? JSON.parse(raw) : [];
                const sel = document.getElementById('existingUserSelect');
                if(!sel) return;
                const current = sel.value;
                sel.innerHTML = '';
                const noneOpt = document.createElement('option');
                noneOpt.value = '';
                noneOpt.textContent = '(none yet)';
                sel.appendChild(noneOpt);
                for(const u of users){

                    opt.value = u;
                    opt.textContent = u;
                    sel.appendChild(opt);
                }
                if(current) sel.value = current;
            }catch(_e){}
        }

            try{
                const raw = localStorage.getItem('sw_existing_users');
                const users = raw ? JSON.parse(raw) : [];
                if(!users.includes(user)) users.push(user);
                localStorage.setItem('sw_existing_users', JSON.stringify(users.slice(-25)));
                updateExistingUserDropdown();
            }catch(_e){}
        }

        // event binding

        // Touch / mouse controls for movement (buttons at bottom)
        // Maps to the existing keyboard system by manipulating `keysPressed`.
        const touchLeftBtn = document.getElementById('touchLeft');
        const touchRightBtn = document.getElementById('touchRight');

        if(touchLeftBtn){

            });

                keysPressed.delete('ArrowLeft');
            });
            touchLeftBtn.addEventListener('pointercancel', (ev)=>{

            });

            });
        }

        function enableDpad(isDown, key){
            if(!key) return;
            if(gameState !== "playing") return;
            if(isDown) keysPressed.add(key);
            else keysPressed.delete(key);
        }

        function bindDpadButton(el, key){
            if(!el || !key) return;
            const down = (ev)=>{ ev.preventDefault(); enableDpad(true, key); };
            const up = (ev)=>{ ev.preventDefault(); enableDpad(false, key); };

            el.addEventListener('pointerdown', down);
            el.addEventListener('pointerup', up);
            el.addEventListener('pointercancel', up);
            el.addEventListener('pointerleave', up);
        }

        // Movement
        document.querySelectorAll('.dpad-btn[data-key]').forEach(btn=>{
            bindDpadButton(btn, btn.getAttribute('data-key'));
        });



        // Also allow touch dragging on the left side: touch position relative to center controls left/right,
        // and if the player has verticalEnabled we use vertical position for up/down.
        // This complements the D-pad so the whole left-bottom area can move the ship.
        let dragTouchActive = false;
        let dragTouchId = null;
        function handleGamePointerMove(ev){
            if(gameState !== "playing") return;
            const rect = canvas.getBoundingClientRect();
            const x = (ev.clientX - rect.left) * (W / rect.width);
            const y = (ev.clientY - rect.top) * (H / rect.height);

            const cx = W/2;
            const dead = 18;
            if(x < cx - dead) keysPressed.add('ArrowLeft'); else keysPressed.delete('ArrowLeft');
            if(x > cx + dead) keysPressed.add('ArrowRight'); else keysPressed.delete('ArrowRight');

            if(player.verticalEnabled){
                const cy = H-170;
                const vdead = 22;
                if(y < cy - vdead) keysPressed.add('ArrowUp'); else keysPressed.delete('ArrowUp');
                if(y > cy + vdead) keysPressed.add('ArrowDown'); else keysPressed.delete('ArrowDown');
            } else {
                keysPressed.delete('ArrowUp');
                keysPressed.delete('ArrowDown');
            }
        }
        canvas.addEventListener('pointerdown', (ev)=>{
            if(gameState !== "playing") return;
            // only treat as drag control if touch is in bottom-left region
            const rect = canvas.getBoundingClientRect();
            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;
            const w = rect.width;
            const h = rect.height;
            const bottomLeft = (x < w*0.6 && y > h*0.55);
            if(!bottomLeft) return;
            ev.preventDefault();
            dragTouchActive = true;
            dragTouchId = ev.pointerId;
            canvas.setPointerCapture?.(ev.pointerId);
            handleGamePointerMove(ev);
        });
        canvas.addEventListener('pointermove', (ev)=>{
            if(!dragTouchActive) return;
            if(ev.pointerId !== dragTouchId) return;
            ev.preventDefault();
            handleGamePointerMove(ev);
        });
        const stopDrag = (ev)=>{
            if(!dragTouchActive) return;
            if(ev.pointerId !== dragTouchId) return;
            dragTouchActive = false;
            dragTouchId = null;
            // release movement keys from drag
            keysPressed.delete('ArrowLeft');
            keysPressed.delete('ArrowRight');
            keysPressed.delete('ArrowUp');
            keysPressed.delete('ArrowDown');
        };
        canvas.addEventListener('pointerup', stopDrag);
        canvas.addEventListener('pointercancel', stopDrag);

        // Mobile pause button (top-right)
        const pauseButtonUI = document.getElementById('pauseButtonUI');
        if(pauseButtonUI){
            pauseButtonUI.addEventListener('pointerdown', (ev)=>{
                ev.preventDefault();
                if(gameState === 'playing'){
                    gameState = 'paused';
                    pauseMenuIndex = 0;
                    showPanel('pausePanel');
                } else if(gameState === 'paused'){
                    gameState = 'playing';
                    hidePanels();
                }
            });
        }

        // Pause panel buttons (mouse/touch functional)
        function setPauseSelectionAndActivate(idx){

            pauseMenuIndex = idx;
            if(gameState !== "paused") return;
            if(pauseMenuIndex===0) backToMenu();
            else if(pauseMenuIndex===1) { resetGameSession(); startGame(); }
            else { gameState="playing"; hidePanels(); }
        }
        document.getElementById("pauseMenuBtn0").addEventListener("click", ()=>setPauseSelectionAndActivate(0));
        document.getElementById("pauseMenuBtn1").addEventListener("click", ()=>setPauseSelectionAndActivate(1));
        document.getElementById("pauseMenuBtn2").addEventListener("click", ()=>setPauseSelectionAndActivate(2));

        window.addEventListener("keydown", (e)=>{

            if(gameState === "playing" && e.repeat !== true && (e.key === "p" || e.key === "Escape")) { gameState="paused"; showPanel("pausePanel"); pauseMenuIndex=0; }

            if(gameState === "paused") {
                if(e.key === "ArrowUp") pauseMenuIndex = (pauseMenuIndex-1+3)%3;
                if(e.key === "ArrowDown") pauseMenuIndex = (pauseMenuIndex+1)%3;
                if(e.key === "Enter") {
                    if(pauseMenuIndex===0) { backToMenu(); }
                    else if(pauseMenuIndex===1) { resetGameSession(); startGame(); }
                    else { gameState="playing"; hidePanels(); }
                }
                if(e.key === "Escape") { gameState="playing"; hidePanels(); }
            }

            if(gameState === "menu" && e.key === " ") startGame();
            if(gameState === "gameover" && e.key === "r") { resetGameSession(); startGame(); }
            if(gameState === "victory" && e.key === "r") { resetGameSession(); startGame(); }
            if(e.key === "v" && gameState==="playing") player.verticalEnabled = !player.verticalEnabled;
            keysPressed.add(e.key);
        });
        window.addEventListener("keyup", (e)=> keysPressed.delete(e.key));
        // Existing pilot dropdown logic
        document.getElementById("existingUserSelect").addEventListener('change', (e)=>{
            const v = e.target.value || '';
            if(v){
                document.getElementById('loginUsername').value = v;
            }
        });
        
        document.getElementById("loginExistingBtn").addEventListener("click", ()=>{
            const user = document.getElementById('existingUserSelect').value || document.getElementById("loginUsername").value.trim();
            doLogin(user);
        });
        document.getElementById("registerNewBtn").addEventListener("click", registerUser);

        document.getElementById("startGameBtn").addEventListener("click", startGame);
        document.getElementById("restartGameBtn").addEventListener("click", ()=>{ resetGameSession(); startGame(); });
        document.getElementById("menuQuitBtn").addEventListener("click", backToMenu);
        document.getElementById("victoryRestartBtn").addEventListener("click", ()=>{ resetGameSession(); startGame(); });
        document.getElementById("victoryMenuBtn").addEventListener("click", backToMenu);
        
        // init background stars

        for(let i=0;i<220;i++) stars.push({x:randInt(0,W), y:randInt(0,H), size:randInt(1,3), twinkle:Math.random()*6.28});

        
        // start loop
        resetGameSession();
        gameState="login";
        showPanel("loginPanel");
        requestAnimationFrame(gameLoop);
        primeSprites();
        // populate dropdown with remembered users
        updateExistingUserDropdown();


        // round rect helper
        if(!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ if(w<2*r) r=w/2; if(h<2*r) r=h/2; this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y); return this; };
        }
    })();
</script>
</body>
</html>
